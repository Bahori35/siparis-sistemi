name: Build Mobile Apps (Android APK and iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. ANDROID BUILD (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Flutter Scaffold
        run: |
          mkdir -p /tmp/mobile_src
          cp -r mobile/lib /tmp/mobile_src/
          cp -r mobile/assets /tmp/mobile_src/ 2>/dev/null || true
          rm -rf mobile
          flutter create --org com.ibrahimabi.orderapp --project-name order_app mobile
          cd mobile
          flutter pub add http:^1.2.0 provider:^6.1.2 shared_preferences:^2.2.3 image_picker:^1.1.2
          flutter pub add --dev flutter_launcher_icons:^0.13.1
          cp -r /tmp/mobile_src/lib/* lib/
          mkdir -p assets
          cp -r /tmp/mobile_src/assets/* assets/ 2>/dev/null || true
          rm -f test/widget_test.dart

          printf "\nflutter_launcher_icons:\n  android: true\n  ios: true\n  image_path: \"assets/logo.png\"\n  min_sdk_android: 21\n\nflutter:\n  assets:\n    - assets/logo.png\n" >> pubspec.yaml

          dart run flutter_launcher_icons

          # Add Permissions, HTTP cleartext traffic & App Label to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>/' $MANIFEST
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i 's/android:label="order_app"/android:label="Hızlı ve Micro Sipariş"/' $MANIFEST

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 2. IOS SIMULATOR DERLEME
  # ==========================================
  build-ios:
    name: Build iOS App (Simulator Debug)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Flutter Scaffold
        run: |
          mkdir -p /tmp/mobile_src
          cp -r mobile/lib /tmp/mobile_src/
          cp -r mobile/assets /tmp/mobile_src/ 2>/dev/null || true
          rm -rf mobile
          flutter create --platforms=ios --org com.ibrahimabi.orderapp --project-name order_app mobile
          cd mobile
          flutter pub add http:^1.2.0 provider:^6.1.2 shared_preferences:^2.2.3 image_picker:^1.1.2
          flutter pub add --dev flutter_launcher_icons:^0.13.1
          cp -r /tmp/mobile_src/lib/* lib/
          mkdir -p assets
          cp -r /tmp/mobile_src/assets/* assets/ 2>/dev/null || true
          rm -f test/widget_test.dart

          printf "\nflutter_launcher_icons:\n  android: true\n  ios: true\n  image_path: \"assets/logo.png\"\n\nflutter:\n  assets:\n    - assets/logo.png\n" >> pubspec.yaml

          dart run flutter_launcher_icons

          # Add iOS photo library permission description to Info.plist
          PLIST="ios/Runner/Info.plist"
          sed -i '' 's/<dict>/<dict>\n\t<key>CFBundleDisplayName<\/key>\n\t<string>Hızlı ve Micro Sipariş<\/string>\n\t<key>NSPhotoLibraryUsageDescription<\/key>\n\t<string>Ürün fotoğrafı seçebilmeniz için galeri izni gereklidir.<\/string>\n\t<key>NSCameraUsageDescription<\/key>\n\t<string>Ürün fotoğrafı çekebilmeniz için kamera izni gereklidir.<\/string>/' $PLIST

      - name: Build iOS
        working-directory: mobile
        run: flutter build ios --simulator --debug --no-codesign

      - name: Package iOS App (.zip)
        run: |
          cd mobile/build/ios/iphonesimulator
          zip -r ../../../App-iOS-Simulator.zip Runner.app

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Runner-App
          path: App-iOS-Simulator.zip
          retention-days: 14
