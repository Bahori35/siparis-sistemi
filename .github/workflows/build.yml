name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. ANDROID BUILD (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Flutter Project Structure
        working-directory: mobile
        run: |
          # Temp backup of lib and pubspec
          mkdir -p /tmp/mobile_src
          cp -r lib pubspec.yaml /tmp/mobile_src/
          cd ..
          rm -rf mobile
          flutter create --org com.ibrahimabi.orderapp --project-name order_app mobile
          cp -r /tmp/mobile_src/lib/* mobile/lib/
          cp /tmp/mobile_src/pubspec.yaml mobile/pubspec.yaml

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 2. IOS BUILD (Runner.app for Simulator / Test)
  # ==========================================
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Flutter Project Structure
        working-directory: mobile
        run: |
          mkdir -p /tmp/mobile_src
          cp -r lib pubspec.yaml /tmp/mobile_src/
          cd ..
          rm -rf mobile
          flutter create --platforms=ios --org com.ibrahimabi.orderapp --project-name order_app mobile
          cp -r /tmp/mobile_src/lib/* mobile/lib/
          cp /tmp/mobile_src/pubspec.yaml mobile/pubspec.yaml

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS for Simulator
        working-directory: mobile
        run: flutter build ios --simulator --debug

      - name: Package iOS Build (.zip)
        working-directory: mobile
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../App-iOS-Simulator.zip Runner.app

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Runner-App
          path: App-iOS-Simulator.zip
          retention-days: 14
