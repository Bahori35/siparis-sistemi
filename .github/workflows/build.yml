name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub arayüzünden tek tıkla manuel tetikleme desteği

jobs:
  # ==========================================
  # 1. ANDROID BUILD (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Skeleton if missing
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.ibrahimabi.orderapp .
          fi

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 2. IOS BUILD (Runner.app / Payload)
  # ==========================================
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Skeleton if missing
        working-directory: mobile
        run: |
          if [ ! -d "ios" ]; then
            flutter create --org com.ibrahimabi.orderapp .
          fi

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS (No Codesign for Simulator / Ad-hoc Archive)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Package iOS Build
        working-directory: mobile
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r App-iOS-Unsigned.ipa Payload/

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release-Package
          path: mobile/build/ios/iphoneos/App-iOS-Unsigned.ipa
          retention-days: 14
