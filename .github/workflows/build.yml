name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. ANDROID BUILD (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Create Pristine Flutter Project
        run: |
          mkdir -p /tmp/mobile_src
          cp -r mobile/lib /tmp/mobile_src/
          rm -rf mobile
          flutter create --org com.ibrahimabi.orderapp --project-name order_app mobile
          cd mobile
          flutter pub add http:^1.2.0 provider:^6.1.2 shared_preferences:^2.2.3
          cp -r /tmp/mobile_src/lib/* lib/
          flutter analyze --no-fatal-infos || true

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons -v

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 2. IOS BUILD (Runner.app for Simulator / Test)
  # ==========================================
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Create Pristine Flutter Project
        run: |
          mkdir -p /tmp/mobile_src
          cp -r mobile/lib /tmp/mobile_src/
          rm -rf mobile
          flutter create --platforms=ios --org com.ibrahimabi.orderapp --project-name order_app mobile
          cd mobile
          flutter pub add http:^1.2.0 provider:^6.1.2 shared_preferences:^2.2.3
          cp -r /tmp/mobile_src/lib/* lib/

      - name: Build iOS
        working-directory: mobile
        run: flutter build ios --simulator --debug --no-codesign

      - name: Package iOS App (.zip)
        run: |
          cd mobile/build/ios/iphonesimulator
          zip -r ../../../App-iOS-Simulator.zip Runner.app

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Runner-App
          path: App-iOS-Simulator.zip
          retention-days: 14
